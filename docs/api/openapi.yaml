openapi: 3.1.0
info: {title: FrameFlow API, version: 0.1.0}
servers: [{url: http://127.0.0.1:28741}]
security: [{bearerAuth: []}]
paths:
  /health:
    get: {security: [], responses: {'200': {description: Healthy}}}
  /api/projects:
    get: {responses: {'200': {description: Project list}}}
    post: {requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateProject'}}}}, responses: {'201': {description: Created}}}
  /api/projects/{id}:
    get: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Project}, '404': {description: Not found}}}
  /api/projects/{id}/drafts:
    post: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Draft saved}}}
  /api/projects/{id}/drafts/{draftId}:
    get: {parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}], responses: {'200': {description: Scoped draft including revision and saved candidate state, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}, '404': {description: Draft not found}}}
    put:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DraftRevisionWrite'}}}}
      responses: {'200': {description: Saved draft with new revision, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}, '409': {description: Revision conflict; current draft returned}}
  /api/projects/{id}/drafts/{draftId}/candidates:
    get: {parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}], responses: {'200': {description: Story and storyboard candidates for this draft, content: {application/json: {schema: {type: object, properties: {candidates: {type: array, items: {$ref: '#/components/schemas/Candidate'}}}}}}}}}
    post:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateCandidate'}}}}
      responses: {'202': {description: Generation task and candidate accepted}, '409': {description: Draft revision conflict}}
  /api/projects/{id}/drafts/{draftId}/candidates/{candidateId}:
    get: {parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}, {$ref: '#/components/parameters/CandidateID'}], responses: {'200': {description: Candidate preview, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}}}
  /api/projects/{id}/drafts/{draftId}/candidates/{candidateId}/apply:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}, {$ref: '#/components/parameters/CandidateID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApplyCandidate'}}}}
      responses: {'200': {description: Candidate applied with undo or restore point}, '409': {description: Draft changed; explicit reconfirmation required}}
  /api/projects/{id}/drafts/{draftId}/restore:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RestoreDraft'}}}}
      responses: {'200': {description: Saved prior body or storyboard restored}, '409': {description: Draft revision conflict}}
  /api/projects/{id}/drafts/{draftId}/scenes:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SceneWrite'}}}}
      responses: {'201': {description: Scene created with stable ID}, '409': {description: Draft revision conflict}}
  /api/projects/{id}/drafts/{draftId}/scenes/{sceneId}:
    patch:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}, {$ref: '#/components/parameters/SceneID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SceneWrite'}}}}
      responses: {'200': {description: Scene updated copied or reordered}, '409': {description: Draft revision conflict}}
    delete:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}, {$ref: '#/components/parameters/SceneID'}, {$ref: '#/components/parameters/ExpectedVersion'}]
      responses: {'200': {description: Scene deleted with recovery snapshot}, '409': {description: Draft revision conflict}}
  /api/projects/{id}/drafts/{draftId}/scenes/{sceneId}/bindings:
    put:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}, {$ref: '#/components/parameters/SceneID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BindingWrite'}}}}
      responses: {'200': {description: Confirmed bindings for this scene}, '409': {description: Draft revision conflict}}
  /api/projects/{id}/drafts/{draftId}/scenes/{sceneId}/video-validation:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}, {$ref: '#/components/parameters/SceneID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [model_id, resolution], properties: {model_id: {type: string}, resolution: {type: string, enum: [720P, 1080P]}}}}}}
      responses: {'200': {description: Per-field video input validation result, content: {application/json: {schema: {$ref: '#/components/schemas/VideoValidationResult'}}}}}
  /api/projects/{id}/drafts/{draftId}/scenes/{sceneId}/video-tasks:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}, {$ref: '#/components/parameters/SceneID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateVideoTask'}}}}
      responses: {'202': {description: Scoped immutable task created, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}, '409': {description: Draft revision conflict}, '422': {description: Model input rejected with scene and field errors}}
  /api/projects/{id}/drafts/{draftId}/video-tasks/batch:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateVideoTask'}}}}
      responses: {'202': {description: Per-scene created and failed lists, content: {application/json: {schema: {$ref: '#/components/schemas/BatchVideoResult'}}}}, '422': {description: Invalid scenes listed}}
  /api/projects/{id}/drafts/{draftId}/scenes/{sceneId}/versions:
    get: {parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}, {$ref: '#/components/parameters/SceneID'}], responses: {'200': {description: Saved video versions and selected version, content: {application/json: {schema: {type: object, properties: {versions: {type: array, items: {$ref: '#/components/schemas/VideoVersion'}}, selected_version_id: {type: string}}}}}}}}
  /api/projects/{id}/drafts/{draftId}/scenes/{sceneId}/selected-version:
    put:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}, {$ref: '#/components/parameters/SceneID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SelectVersion'}}}}
      responses: {'200': {description: Selected version updated}, '409': {description: Draft revision conflict}}
  /api/projects/{id}/drafts/{draftId}/compositions:
    get: {parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}], responses: {'200': {description: Saved compositions for this draft, content: {application/json: {schema: {type: object, properties: {compositions: {type: array, items: {$ref: '#/components/schemas/Composition'}}}}}}}}}
    post:
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateComposition'}}}}
      responses: {'202': {description: Immutable composition task accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}, '409': {description: Draft revision conflict}, '422': {description: Missing or invalid scene clips listed}}
  /api/projects/{id}/drafts/{draftId}/compositions/{compositionId}/download:
    get: {parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/DraftPathID'}, {$ref: '#/components/parameters/CompositionID'}], responses: {'200': {description: Saved MP4 attachment}, '409': {description: Composition not ready}}}
  /api/projects/{id}/drafts/{draftId}/reference-image-tasks:
    post:
      operationId: createReferenceImage
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: draftId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReferenceImageRequest'}
      responses:
        '202':
          description: Idempotent image task; successful result is stored as result-{task.id} material
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {description: Invalid input or unsupported model}
        '409': {description: Idempotency key reused with changed parameters}
  /api/tasks:
    get: {parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/DraftID'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}], responses: {'200': {description: Task page, optionally filtered by project and draft}}}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, draft_id, prompt]
              properties:
                project_id: {type: string, minLength: 1}
                draft_id: {type: string, minLength: 1}
                kind: {type: string, enum: [story, image, video]}
                prompt: {type: string}
                model_id: {type: string, description: Model selected from a provider connection; defaults to the operation default when omitted}
                aspect_ratio: {type: string}
                source_image_url: {type: string}
                last_frame_url: {type: string}
                driving_audio_url: {type: string}
                duration: {type: integer, minimum: 2, maximum: 15}
                resolution: {type: string, enum: [720P, 1080P]}
                expected_version: {type: integer, minimum: 0}
      responses: {'202': {description: Task accepted}}
  /api/tasks/{id}:
    get: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Task}}}
    delete: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Deleted}}}
  /api/tasks/{id}/cancel:
    post: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Cancelled}}}
  /api/tasks/{id}/retry:
    post: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'202': {description: Retried}}}
  /api/tasks/{id}/result:
    get: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Completed task metadata as a JSON attachment}, '409': {description: Result not ready}}}
  /api/tasks/{id}/download:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Saved PNG or MP4 attachment, content: {image/png: {schema: {type: string, format: binary}}, video/mp4: {schema: {type: string, format: binary}}}}
        '409': {description: No saved media file or result not ready}
  /ws:
    get:
      parameters:
        - {name: token, in: query, required: false, schema: {type: string}, description: API authentication token}
      responses:
        '101': {description: WebSocket broadcasts task events including task_id, project_id and draft_id; clients send text ping every 15 seconds and refresh tasks over HTTP after reconnect}
  /api/providers:
    get: {responses: {'200': {description: Provider list}}}
    post: {responses: {'201': {description: Provider saved}}}
  /api/providers/{id}/test:
    post: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Connection healthy}, '422': {description: Connection failed}}}
  /api/connections:
    get: {responses: {'200': {description: Vendor connections without secrets}}}
    post: {requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionInput'}}}}, responses: {'201': {description: Vendor connection created}}}
  /api/connections/{id}:
    put: {parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionInput'}}}}, responses: {'200': {description: Vendor connection updated}}}
    delete: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Deleted after models are removed}, '409': {description: Connection has models}}}
  /api/connections/{id}/test:
    post: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Model discovery endpoint reachable}, '422': {description: Authentication or discovery failed}}}
  /api/connections/{id}/models:
    get: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Models for this connection}}}
    post: {parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ManualModel'}}}}, responses: {'201': {description: Model added; unknown models are not executable}}}
  /api/connections/{id}/models/sync:
    post: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Discovered models upserted without overwriting manual entries}}}
  /api/connections/{id}/models/{model}:
    patch: {parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/ModelID'}], responses: {'200': {description: Model enabled or selected as default}}}
    delete: {parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/ModelID'}], responses: {'204': {description: Model removed}}}
  /api/models:
    get: {parameters: [{name: capability, in: query, schema: {type: string, enum: [story, image, video]}}, {name: connection_id, in: query, schema: {type: string}}], responses: {'200': {description: Model list}}}
  /api/models/{model}/video-capability:
    get: {parameters: [{$ref: '#/components/parameters/ModelID'}], responses: {'200': {description: Verified model input limits or unsupported reason}}}
  /api/materials:
    get:
      parameters: [{name: project_id, in: query, description: Include project reference images alongside library assets, schema: {type: string}}, {name: kind, in: query, schema: {type: string, enum: [scene, character, prop, voice, music]}}, {name: q, in: query, schema: {type: string}}, {name: media_type, in: query, schema: {type: string, enum: [image, audio]}}]
      responses: {'200': {description: Material list sorted newest first, content: {application/json: {schema: {type: object, properties: {materials: {type: array, items: {$ref: '#/components/schemas/Material'}}}}}}}}
    post: {requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Material'}}}}, responses: {'201': {description: Material saved}}}
  /api/materials/upload:
    post:
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file, kind], properties: {reference_only: {type: boolean, default: false}, project_id: {type: string}, file: {type: string, format: binary}, kind: {type: string, enum: [scene, character, prop, voice, music]}, name: {type: string}}}}}}
      responses: {'201': {description: Uploaded material with extracted metadata, content: {application/json: {schema: {$ref: '#/components/schemas/Material'}}}}}
  /api/materials/{id}:
    get: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Material, content: {application/json: {schema: {$ref: '#/components/schemas/Material'}}}}}}
    put: {parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Material'}}}}, responses: {'200': {description: Metadata updated}}}
    delete: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Unreferenced material deleted}, '409': {description: Material still referenced}}}
  /api/materials/{id}/library:
    post: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Explicitly saved to library, content: {application/json: {schema: {$ref: '#/components/schemas/Material'}}}}}}
  /api/materials/{id}/uses:
    get: {parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Material usage locations, content: {application/json: {schema: {type: object, properties: {uses: {type: array, items: {type: string}}}}}}}}}
